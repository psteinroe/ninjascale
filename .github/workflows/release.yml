name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract_version:
    name: Extract Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up git-cliff
        uses: kenji-miyake/setup-git-cliff@v1

      - name: Set version name
        id: set_version
        run: echo "version=$(git cliff --bumped-version)" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Run tests
        run: go test -race ./...

  create_release:
    name: Create GitHub Release Draft
    runs-on: ubuntu-latest
    needs: [extract_version, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Changelog
        uses: orhun/git-cliff-action@v4
        id: changelog
        with:
          config: cliff.toml
          args: --bump --unreleased
        env:
          GITHUB_REPO: ${{ github.repository }}

      - name: Ensure tag matches
        if: steps.changelog.outputs.version != needs.extract_version.outputs.version
        run: |
          echo "Tag does not match: ${{ steps.changelog.outputs.version }} vs ${{ needs.extract_version.outputs.version }}"
          exit 1

      - name: Create Release
        uses: softprops/action-gh-release@v2
        id: create-release
        with:
          body: |
            ${{ steps.changelog.outputs.content }}

            ## Docker Image

            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ needs.extract_version.outputs.version }}
            ```
          tag_name: ${{ steps.changelog.outputs.version }}
          draft: true

      - name: Output Link to Workflow Summary
        run: |
          {
            echo "# Release Draft Created"
            echo ""
            echo "## Next Steps"
            echo "1. Review the release draft: [Link](${{ steps.create-release.outputs.url }})"
            echo "2. Edit the release notes if needed"
            echo "3. Click **Publish Release** to:"
            echo "   - Make the release public"
            echo "   - Trigger Docker image build and binary release"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
